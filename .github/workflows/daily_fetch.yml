name: 🏀 NBA Napi Adatfrissítés

on:
  schedule:
    - cron: "0 8 * * *"    # naponta 08:00 UTC (10:00 CEST)
  workflow_dispatch:
    inputs:
      season:
        description: "NBA szezon (pl. 2025-26)"
        required: false
        default: "2025-26"

jobs:
  fetch-and-upload:
    name: Adatgyűjtés & Firebase feltöltés
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: fetcher/requirements.txt

      - name: 📦 Python csomagok telepítése
        run: pip install -r fetcher/requirements.txt

      - name: 🔐 Firebase hitelesítés beállítása
        working-directory: fetcher
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > serviceAccount.json

      - name: ⚙️ Környezeti változók beállítása
        working-directory: fetcher
        run: |
          cat > .env << 'ENVEOF'
          NBA_SEASON=${{ github.event.inputs.season || '2025-26' }}
          REQUEST_DELAY=5.0
          TIMEOUT_DEFAULT=90
          MIN_GAMES=10
          FIREBASE_SERVICE_ACCOUNT=serviceAccount.json
          ENVEOF

      # GitHub Actions Azure IP-k néha blokkolva vannak az NBA.com-on.
      # 60 másodperces várakozás csökkenti a rate-limit valószínűségét.
      - name: ⏳ Várakozás az NBA.com rate-limit elkerülésére
        run: sleep 60

      - name: 🏀 NBA adatok letöltése és feltöltése
        working-directory: fetcher
        env:
          NBA_SEASON: ${{ github.event.inputs.season || '2025-26' }}
          REQUEST_DELAY: "5.0"
          TIMEOUT_DEFAULT: "90"
        run: python fetch_stats.py

      - name: 🗑️ Érzékeny fájlok törlése
        if: always()
        working-directory: fetcher
        run: rm -f serviceAccount.json .env

      - name: 📢 Hiba értesítés
        if: failure()
        run: |
          echo "❌ Sikertelen: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Lehetséges ok: NBA.com IP-blokk (Azure IP-tartomány)."
          echo "Megoldás: futtasd le manuálisan a helyi gépen."
